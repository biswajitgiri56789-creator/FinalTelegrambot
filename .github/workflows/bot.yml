name: Amazon Deals Bot

on:
  schedule:
    # Run every hour at 5 minutes past
    - cron: '5 * * * *'
    
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main ]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create tracker file
      run: |
        if [ ! -f deal_tracker.json ]; then
          echo '{"posted": [], "tracker": {}, "last_updated": ""}' > deal_tracker.json
        fi
        
    - name: Run Smart Deals Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
      run: |
        python bot.py
        
    - name: Commit and push tracker
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add deal_tracker.json
        git commit -m "Update deal tracker" || echo "No changes to commit"
        git push || echo "Nothing to push"
